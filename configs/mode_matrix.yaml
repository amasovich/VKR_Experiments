# Матрица режимов испытаний ВКР.
# Текущая версия фиксирует калиброванный набор HW PLC S7-1200 mode.
# Экспериментальные KPI в этом файле не фиксируются.

matrix_status: hw_plc_s7_1200_modes_fixed_before_rawlogs_export
methodology_basis: "МИФИ_ВКР_2026_Березняк_В_Н_v5.pdf, разделы 2.2, 2.7, 3.6"
execution_gate: "HW PLC technical DB snapshots are allowed for RawLogs pipeline validation; comparative VPLC runs require mirrored VPLC workload implementation."

defaults:
  duration_s: 600
  series_count: 3
  warmup_policy: "reset_log_request before run; wait until buffer_wrapped=TRUE; freeze_logging=TRUE before manual DB snapshot"
  method_status: rawlogs_schema_cycle_v0_2_defined_manual_db_snapshot_for_hw_plc
  workload_status: workload_profile_v0_2_siemens_scl_implemented_vplc_pending
  workload_profile: "configs\\workload_profile_v0.yaml"
  rawlogs_schema: "configs\\rawlogs_schema_cycle_v0.yaml"
  timestamp_source_hw_plc: plc_internal_rd_loc_t_nanosecond
  rawlog_buffer_rows_hw_plc: 1000
  buffer_policy: "1000 rows are sufficient for technical pipeline validation; final KPI should use repeated series or a larger/streamed capture method."

modes:
  - mode_id: S7_L0_IDLE_10_20
    class_id: S7_L0
    comparison_pair_id: PLC_L0_IDLE_10_20
    object: HW_PLC
    scenario: idle_cycle
    t0_ms: 10
    deadline_threshold_ms: 20
    load_level: 0
    load_passes: 0
    stress_flag: baseline
    duration_s: 600
    series_count: 3
    purpose: "Базовая линия аппаратного PLC без прикладной нагрузки."
    status: fixed_for_hw_plc_run
    mirrored_vplc_mode_required: VPLC_L0_IDLE_10_20

  - mode_id: VPLC_L0_IDLE_10_20
    class_id: VPLC_L0
    comparison_pair_id: PLC_L0_IDLE_10_20
    object: vPLC_container
    scenario: idle_cycle
    t0_ms: 10
    deadline_threshold_ms: 20
    load_level: 0
    load_passes: 0
    stress_flag: baseline
    duration_s: 600
    series_count: 3
    purpose: "Зеркальная базовая линия VPLC без прикладной нагрузки."
    status: planned_pending_vplc_workload_and_rawlogs_method

  - mode_id: S7_L1_LIGHT_10_20
    class_id: S7_L1
    comparison_pair_id: PLC_L1_LIGHT_10_20
    object: HW_PLC
    scenario: workload_cycle_light
    t0_ms: 10
    deadline_threshold_ms: 20
    load_level: 1
    load_passes: 32
    stress_flag: baseline
    duration_s: 600
    series_count: 3
    purpose: "Лёгкая детерминированная workload-нагрузка аппаратного PLC."
    status: fixed_for_hw_plc_run
    mirrored_vplc_mode_required: VPLC_L1_LIGHT_10_20

  - mode_id: VPLC_L1_LIGHT_10_20
    class_id: VPLC_L1
    comparison_pair_id: PLC_L1_LIGHT_10_20
    object: vPLC_container
    scenario: workload_cycle_light
    t0_ms: 10
    deadline_threshold_ms: 20
    load_level: 1
    load_passes: 32
    stress_flag: baseline
    duration_s: 600
    series_count: 3
    purpose: "Зеркальная лёгкая workload-нагрузка VPLC."
    status: planned_pending_vplc_workload_and_rawlogs_method

  - mode_id: S7_L2_MEDIUM_25_35
    class_id: S7_L2
    comparison_pair_id: PLC_L2_MEDIUM_25_35
    object: HW_PLC
    scenario: workload_cycle_medium
    t0_ms: 25
    deadline_threshold_ms: 35
    load_level: 2
    load_passes: 128
    stress_flag: baseline
    duration_s: 600
    series_count: 3
    purpose: "Средняя детерминированная workload-нагрузка аппаратного PLC."
    status: fixed_for_hw_plc_run
    mirrored_vplc_mode_required: VPLC_L2_MEDIUM_25_35

  - mode_id: VPLC_L2_MEDIUM_25_35
    class_id: VPLC_L2
    comparison_pair_id: PLC_L2_MEDIUM_25_35
    object: vPLC_container
    scenario: workload_cycle_medium
    t0_ms: 25
    deadline_threshold_ms: 35
    load_level: 2
    load_passes: 128
    stress_flag: baseline
    duration_s: 600
    series_count: 3
    purpose: "Зеркальная средняя workload-нагрузка VPLC."
    status: planned_pending_vplc_workload_and_rawlogs_method

  - mode_id: S7_L3_HIGH_75_100
    class_id: S7_L3
    comparison_pair_id: PLC_L3_HIGH_75_100
    object: HW_PLC
    scenario: workload_cycle_high
    t0_ms: 75
    deadline_threshold_ms: 100
    load_level: 3
    load_passes: 512
    stress_flag: high
    duration_s: 600
    series_count: 3
    purpose: "Высокая workload-нагрузка аппаратного PLC с рабочим запасом по deadline."
    status: fixed_for_hw_plc_run
    mirrored_vplc_mode_required: VPLC_L3_HIGH_75_100

  - mode_id: VPLC_L3_HIGH_75_100
    class_id: VPLC_L3
