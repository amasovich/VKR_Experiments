    duration_s: 600
    series_count: 3
    purpose: "Зеркальный предельный stress-режим VPLC."
    status: planned_pending_vplc_workload_and_rawlogs_method

notes:
  - "Режимы S7_* зафиксированы для ближайшего HW PLC S7-1200 съёма RawLogs."
  - "Текущие DB snapshots в plc\\siemens_s7_1200\\for_analize используются как техническая калибровка и проверка процедуры, а не как финальные KPI."
  - "Для сопоставления с vPLC_container должны быть созданы зеркальные VPLC_* режимы с теми же scenario, t0_ms, deadline_threshold_ms, load_level, load_passes, duration_s и series_count."
  - "Перед ручным snapshot Siemens DB требуется reset, ожидание полного заполнения буфера State.buffer_wrapped=TRUE и только затем freeze_logging=TRUE."
  - "Буфер 1000 строк достаточен для первого технического RawLogs pipeline; для финальных KPI рекомендуется несколько серий или расширенный/потоковый метод съёма."
