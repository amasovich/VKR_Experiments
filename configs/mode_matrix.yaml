    load_level: 3
    load_passes: 512
    stress_flag: stress
    duration_s: 600
    series_count: 3
    purpose: "Предельный stress-режим аппаратного PLC на той же высокой нагрузке, но с более жёстким deadline."
    status: fixed_for_hw_plc_run
    mirrored_vplc_mode_required: VPLC_L3_STRESS_75_80

  - mode_id: VPLC_L3_STRESS_75_80
    class_id: VPLC_L3_STRESS
    comparison_pair_id: PLC_L3_STRESS_75_80
