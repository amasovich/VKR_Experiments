  - mode_id: M03
    object: HW_PLC
    scenario: BOOL_LOAD
    t0_ms: 20
    load_level: MID
    stress_flag: BASELINE
    duration_s: 600
    series_count: 3
    status: PLANNED

  - mode_id: M04
    object: VPLC
    scenario: BOOL_LOAD
    t0_ms: 20
    load_level: MID
    stress_flag: BASELINE
    duration_s: 600
    series_count: 3
    status: PLANNED