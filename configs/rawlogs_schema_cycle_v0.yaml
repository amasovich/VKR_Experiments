schema_id: RawLogsCycle_v0
schema_version: "0.2"
status: draft_after_siemens_snapshot_controls
created_at: 2026-05-02
source_doc: "00_docs\\workload_and_metrics_plan.md"
related_workload_profile: "configs\\workload_profile_v0.yaml"

format:
  file_type: csv
  encoding: UTF-8
  delimiter: ","
  decimal_separator: "."
  null_value: ""
  manual_editing_allowed: false

artifact_locations:
  raw_logs_root: "raw_logs"
  processed_tables_root: "processed_tables"
  summary_cards_root: "summary_cards"
  event_journal: "event_journal\\event_journal.csv"

id_rules:
  mode_id_source: "configs\\mode_matrix.yaml"
  series_id_format: "SER_<YYYYMMDD>_<MODEID>_SNN"
  run_id_format: "RUN_<YYYYMMDD>_<MODEID>_SNN_RNN"
  technical_run_suffix: "_TECH"
  examples_are_templates_only:
    series_id: "SER_20260502_C1_VPLC_20_IDLE_REPEAT_S01"
    run_id: "RUN_20260502_C1_VPLC_20_IDLE_REPEAT_S01_R01_TECH"

timestamp_policy:
  accepted_sources:
    - plc_internal
    - plc_internal_rd_loc_t_nanosecond
    - vplc_internal
    - eng_node_poll
    - host_log
    - unavailable
  rule: "The timestamp source must be recorded for every row or run-level metadata file."
  direct_cycle_timestamps_preferred: true
  derived_periods_allowed_only_after_validation: true
  unavailable_policy: "Leave ts_start, ts_end, Tper, Jper, and deadline_miss empty if a valid time base is not confirmed."

quality_flags:
  - ok
  - technical_check
  - missing_timestamp
  - derived_from_polling
  - invalid_row
  - excluded_from_processing

columns:
  - name: run_id
    required: true
    nullable: false
    type: string
    description: "Run identifier."
  - name: mode_id
    required: true
    nullable: false
    type: string
    description: "Mode identifier from mode_matrix.yaml."
  - name: series_id
    required: true
    nullable: false
    type: string
    description: "Series identifier."
  - name: object
    required: true
    nullable: false
    type: enum
    allowed_values:
      - HW_PLC
      - vPLC_container
    description: "Measured branch."
  - name: node_id
    required: true
    nullable: false
    type: enum
    allowed_values:
      - HW_PLC
      - VPLC_HOST
      - ENG_NODE
    description: "Node that produced or collected the row."
  - name: sample_index
    required: true
    nullable: false
    type: integer
    description: "Monotonic row index generated by the collector or source."
  - name: cycle_index
    required: true
    nullable: true
    type: integer
    description: "Cycle number if directly available."
  - name: cycle_counter
    required: true
    nullable: true
    type: integer
    description: "Workload cycle_counter value if observed."
  - name: ts_observe
    required: true
    nullable: true
    type: timestamp
    units: ISO-8601
    description: "Observation timestamp from collector or source."
  - name: ts_start
    required: true
    nullable: true
    type: timestamp_or_number
    units: "ms_or_us"
    description: "Cycle start timestamp if available."
  - name: ts_end
    required: true
    nullable: true
    type: timestamp_or_number
    units: "ms_or_us"
    description: "Cycle end timestamp if available."
  - name: timestamp_tick_ns
    required: true
    nullable: true
    type: integer
    units: ns
    description: "Platform-specific timestamp tick or nanosecond-of-second value when available; not a full wall-clock timestamp."
  - name: timestamp_source
    required: true
    nullable: false
    type: enum
    allowed_values:
      - plc_internal
      - plc_internal_rd_loc_t_nanosecond
      - vplc_internal
      - eng_node_poll
      - host_log
      - unavailable
    description: "Time base used for this row."
  - name: t0_ms
    required: true
    nullable: false
    type: number
    description: "Nominal cycle period from Mode."
  - name: deadline_threshold_ms
    required: true
    nullable: false
    type: number
    units: ms
    description: "Configured deadline threshold for deadline_miss."
  - name: Tper
    required: true
    nullable: true
    type: number
    units: ms
    description: "Measured or validated derived period."
  - name: Jper
    required: true
    nullable: true
    type: number
    units: ms
    description: "Tper - t0_ms, calculated only from valid Tper."
  - name: deadline_miss
    required: true
    nullable: true
    type: integer
    allowed_values:
      - 0
      - 1
    description: "Deadline miss flag after threshold policy is defined."
  - name: heartbeat
    required: true
    nullable: true
    type: integer
    allowed_values:
      - 0
      - 1
    description: "Observed diagnostic heartbeat."
  - name: workload_accumulator
    required: true
    nullable: true
    type: integer
    description: "Observed deterministic accumulator."
  - name: load_level
    required: true
    nullable: true
    type: integer
    description: "Observed workload load_level."
  - name: load_passes
    required: true
    nullable: true
    type: integer
    description: "Effective deterministic workload passes for this row."
  - name: error_flag
    required: true
    nullable: true
    type: integer
    allowed_values:
      - 0
      - 1
    description: "Workload internal error flag, not deadline miss."
  - name: quality_flag
    required: true
    nullable: false
    type: enum
    allowed_values:
      - ok
      - technical_check
      - missing_timestamp
      - derived_from_polling
      - invalid_row
      - excluded_from_processing
    description: "Row quality marker."
  - name: notes
    required: true
    nullable: true
    type: string
    description: "Machine-generated service note. Raw rows must not be manually edited."

processing_policy:
  - "RawLogs are immutable after collection."
  - "Rows marked technical_check may validate the artifact chain but must not be used as experimental KPI."
  - "Rows marked invalid_row or excluded_from_processing require a traceable reason in notes and processed tables."
  - "Tper, Jper, deadline_miss, KPI, and SummaryCard values are produced only after the timestamp source and threshold policy are confirmed."
